name: Organize Codetree files

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codetree-organize-main
  cancel-in-progress: false

jobs:
  move-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Merge numeric folders (preserve nested README)
        shell: bash
        run: |
          set -e
          shopt -s dotglob nullglob

          mkdir -p Codetree/TILs
          moved=0

          for path in *; do
            if [[ "$path" == ".github" || \
                  "$path" == "Codetree" || \
                  "$path" == "SWEA" || \
                  "$path" == "백준" || \
                  "$path" == "프로그래머스" ]]; then
              continue
            fi

            if [[ "$path" =~ ^[0-9] && -d "$path" ]]; then
              target_date_dir="Codetree/TILs/$path"
              mkdir -p "$target_date_dir"

              for item in "$path"/*; do
                [ -e "$item" ] || continue
                base=$(basename "$item")
                target="$target_date_dir/$base"

                # 날짜 바로 아래 파일은 그대로 덮어쓰기
                if [[ -f "$item" ]]; then
                  if [[ -e "$target" ]]; then
                    git rm --cached "$target" 2>/dev/null || true
                    rm -f "$target"
                  fi
                  echo "Moving file: $item -> $target"
                  git mv "$item" "$target"
                  moved=1
                  continue
                fi

                # 문제 폴더면 내부 파일 단위로 merge
                if [[ -d "$item" ]]; then
                  mkdir -p "$target"

                  for sub in "$item"/*; do
                    [ -e "$sub" ] || continue
                    subbase=$(basename "$sub")
                    subtarget="$target/$subbase"

                    if [[ -e "$subtarget" ]]; then
                      git rm -r --cached "$subtarget" 2>/dev/null || true
                      rm -rf "$subtarget"
                    fi

                    echo "Moving nested item: $sub -> $subtarget"
                    git mv "$sub" "$subtarget"
                    moved=1
                  done

                  # 소스 문제 폴더가 비면 삭제
                  rmdir "$item" 2>/dev/null || true
                fi
              done

              # 소스 날짜 폴더가 비면 삭제
              rmdir "$path" 2>/dev/null || true
            fi
          done

          echo "MOVED=$moved" >> "$GITHUB_ENV"

      - name: Show git status
        run: git status --short

      - name: Commit changes
        if: env.MOVED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(codetree): organize submissions under Codetree/TILs"

      - name: Push changes
        if: env.MOVED == '1'
        run: git push
