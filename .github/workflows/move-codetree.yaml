name: Organize Codetree files

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codetree-organize-main
  cancel-in-progress: false

jobs:
  move-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Merge numeric folders (overwrite mode)
        shell: bash
        run: |
          set -e
          shopt -s dotglob nullglob

          mkdir -p Codetree-TILs
          moved=0

          for path in *; do
            if [[ "$path" == ".github" || \
                  "$path" == "Codetree-TILs" || \
                  "$path" == "SWEA" || \
                  "$path" == "백준" || \
                  "$path" == "프로그래머스" ]]; then
              continue
            fi

            # 숫자로 시작하는 폴더만
            if [[ "$path" =~ ^[0-9] && -d "$path" ]]; then
              target_dir="Codetree-TILs/$path"
              mkdir -p "$target_dir"

              for item in "$path"/*; do
                [ -e "$item" ] || continue

                base=$(basename "$item")
                target="$target_dir/$base"

                # 기존 있으면 삭제 (덮어쓰기)
                if [[ -e "$target" ]]; then
                  echo "Removing existing: $target"
                  git rm -r --cached "$target" 2>/dev/null || true
                  rm -rf "$target"
                fi

                echo "Moving: $item -> $target"
                git mv "$item" "$target"
                moved=1
              done

              # 비어있으면 루트 폴더 삭제
              rmdir "$path" 2>/dev/null || true
            fi
          done

          echo "MOVED=$moved" >> "$GITHUB_ENV"

      - name: Show git status
        run: git status --short

      - name: Commit changes
        if: env.MOVED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(codetree): overwrite submissions under Codetree-TILs"

      - name: Push changes
        if: env.MOVED == '1'
        run: git push
